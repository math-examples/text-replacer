<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="version" content="v1.0.10">
<meta name="cdn-owner" content="math-examples">
<meta name="cdn-repo" content="text-replacer">
<!-- No cookies: crossorigin=anonymous on all assets; referrer policy -->
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Text Replacer</title>
<style>
/* Minimal inline reset so page renders even if CSS fails */
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0}
.simple-mode{display:flex;justify-content:center;padding:20px}
.simple-container{max-width:900px;width:100%}
.simple-panes{display:flex;gap:8px}
.simple-panes textarea{flex:1;height:180px;background:#1e1e1e;color:#eee;border:1px solid #444;padding:8px}
.simple-actions{margin-top:8px;display:flex;gap:6px;align-items:center}
.btn-primary{background:#2980b9;color:#fff;border:none;padding:6px 14px;cursor:pointer}
.btn-secondary{background:#444;color:#eee;border:none;padding:6px 14px;cursor:pointer}
.btn-ghost{background:transparent;color:#888;border:1px solid #555;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>

<!-- ═══════════ VERSION BANNER (TOP) ═══════════ -->
<div id="versionBanner" style="background:#1e1e1e;color:#ccc;padding:4px 12px;font-size:11px;text-align:center;border-bottom:1px solid #333;display:flex;justify-content:center;align-items:center;gap:12px;">
<span>Text Replacer <span id="topVersion"></span></span>
<label style="font-size:10px;color:#888;cursor:pointer;user-select:none;" title="Disable SRI hash check (debug only)">
<input type="checkbox" id="toggleSRI" style="vertical-align:middle;"> Disable SRI
</label>
</div>

<!-- ═══════════ ERROR BANNER ═══════════ -->
<div id="loadErrorBanner" style="display:none;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;text-align:center;position:relative;z-index:10000;">
<span id="loadErrorMsg"></span>
<span style="float:right;cursor:pointer;font-weight:bold;" onclick="this.parentElement.style.display='none'">✕</span>
</div>

<!-- ═══════════ SIMPLE MODE ═══════════ -->
<div id="simpleMode" class="simple-mode">
<div class="simple-container">
<h2>Text Replacer</h2>
<p style="color:#888;font-size:12px;">Paste text, set find &amp; replace, and go.</p>
<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
<input id="simpleFrom" placeholder="Find (literal or /regex/)" style="flex:1;padding:6px;background:#1e1e1e;color:#eee;border:1px solid #444;">
<span>→</span>
<input id="simpleTo" placeholder="Replace with" style="flex:1;padding:6px;background:#1e1e1e;color:#eee;border:1px solid #444;">
<label style="font-size:11px;"><input type="checkbox" id="simpleRegex">Regex</label>
<label style="font-size:11px;"><input type="checkbox" id="simpleCase">Aa</label>
</div>
<div class="simple-panes">
<textarea id="simpleInput" spellcheck="false" placeholder="Paste or type text here..."></textarea>
<textarea id="simpleOutput" readonly spellcheck="false" placeholder="Result appears here..."></textarea>
</div>
<div class="simple-actions">
<button id="simpleReplace" class="btn-primary">&#128260; Replace</button>
<button id="simpleCopy" class="btn-secondary">&#128203; Copy</button>
<button id="simpleDownload" class="btn-secondary">&#128190; Save</button>
<span style="flex:1"></span>
<button id="simpleAdvanced" class="btn-ghost">&#9881; Advanced</button>
</div>
</div>
</div>

<!-- ═══════════ FULL UI (collapsed by default) ═══════════ -->
<div id="fullUI" style="display:none;padding:12px;">
<div class="header"><h1 style="margin:0;font-size:16px;">Text Replacer Advanced</h1></div>
<p style="color:#666;font-size:11px;">Advanced mode UI elements loaded via JS modules.</p>
</div>

<!-- ═══════════ LOADER & SRI TOGGLE LOGIC ═══════════ -->
<script>
(function(){
  // --- Version display ---
  var v = document.querySelector('meta[name="version"]');
  if(v){ var ver = v.content; var tv = document.getElementById('topVersion'); if(tv) tv.textContent = ver; }

  // --- SRI Toggle (debug) ---
  var DISABLE_SRI = localStorage.getItem('tr_disable_sri') === '1' || new URLSearchParams(location.search).has('nohash');
  var toggle = document.getElementById('toggleSRI');
  if(toggle){ toggle.checked = DISABLE_SRI; toggle.onchange = function(){ localStorage.setItem('tr_disable_sri', this.checked ? '1' : '0'); location.reload(); }; }

  // --- CDN fallback order ---
  var CDNS = ['https://cdn.jsdelivr.net', 'https://fastly.jsdelivr.net', 'https://gcore.jsdelivr.net'];
  var OWNER = document.querySelector('meta[name="cdn-owner"]').content;
  var REPO = document.querySelector('meta[name="cdn-repo"]').content;
  var VERSION = v ? v.content : 'v1.0.9';

  var ASSETS = [
    {type:'css', path:'css/app.css'},
    {type:'js', path:'js/i18n.js', global:'TR_I18N'},
    {type:'js', path:'js/state.js', global:'TR_STATE'},
    {type:'js', path:'js/processor.js', global:'TR_PROCESSOR'},
    {type:'js', path:'js/rules.js', global:'TR_RULES'},
    {type:'js', path:'js/editor.js'},
    {type:'js', path:'js/sandbox.js'},
    {type:'js', path:'js/batch.js'},
    {type:'js', path:'js/presets.js'},
    {type:'js', path:'js/ui.js', global:'TR_UI'},
    {type:'js', path:'js/app.js'}
  ];

  // Compute SRI synchronously via a tiny inline function (for non-debug mode we still use pre-computed integrity from setup.sh)
  // But since we want toggle, we load dynamically WITHOUT static tags when DISABLE_SRI is true.
  // When SRI is enabled, we inject tags with the integrity values that setup.sh already baked into data-integrity attrs.
  // For simplicity and to keep setup.sh compatible, we just inject script tags with integrity from a hardcoded map
  // that setup.sh also updates. We embed the integrity map below (replaced by setup.sh).

  var SRI_MAP = {
    "css/app.css": "sha384-A4ejZ3LciDivNNeQeZirDuCX5x27AnyzE4gG5GUIuBY5sPz3YCR6EDFI5ww2XGrc",
    "js/i18n.js": "sha384-9DTzVBmf9tJRcbbPIQMBi8gwMXMe3cox/+ZARgYYyDvSz+avnahwgr32x9RVprsO",
    "js/state.js": "sha384-cjZzFyJtBySUz1Si+vDxYMJo+0kVs8+dvZeBdke6UyCJHSD9btMn0V8dfm7UZsPs",
    "js/processor.js": "sha384-v2yQHVN0WYaf7n1Ubq0rK6nn0KYzEl3pN8gi2VnnwJp3eGiwUBtnLbRd8e5HffDS",
    "js/rules.js": "sha384-mnErVyXj32dHXFE2VeWyhhQVm7JL4tx0JV2S9EeEFEVbTbC2RS9AH88gYtyZKBy0",
    "js/editor.js": "sha384-g6JIMbXNi8MbPw+cU8T1yH/mQsAXEikXqt84253gzvxxJ/m6QXBxcbv0/27OtcUr",
    "js/sandbox.js": "sha384-GgzDVGRZWUBpI9KmDlNKzBnQ2ME8HXs3a/leckN/F/sAusCnZww7jbVhRo6GZW97",
    "js/batch.js": "sha384-0K+7Pmzz6a1rnxV2+rlX1Y6IYW7OjOdoAM7ANGxUrGDxxz767Ytw0NiDQntFRgib",
    "js/presets.js": "sha384-Ul0hcKHX9hVI3dPtayApkZ1lMyJsK6bq+goC0gyMFNQ8yjdaQq+h3ZAyqvgIl3M9",
    "js/ui.js": "sha384-Vb/AF0LZU8Rfes0mQtPlOTwUCBYVccXqAy//IcyTLz36ZP18zNxp3g8UYuQGGBvW",
    "js/app.js": "sha384-m4PXRGumkM74kG6hP2crlmDbF8hBhxDFQpq8QkwZQ9rz9L7nGyZFrH2eBjxQ60bv"
  };

  var loadErrors = [];
  var loadedCount = 0;

  function makeUrl(cdnIndex, path){ return CDNS[cdnIndex] + '/gh/' + OWNER + '/' + REPO + '@' + VERSION + '/' + path; }

  function loadAsset(asset, cdnIndex){
    if(cdnIndex >= CDNS.length){ loadErrors.push(asset.path + ' (all CDNs failed)'); return; }
    var url = makeUrl(cdnIndex, asset.path);
    if(asset.type === 'css'){
      var link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = url;
      if(!DISABLE_SRI && SRI_MAP[asset.path]){ link.integrity = SRI_MAP[asset.path]; link.crossOrigin = 'anonymous'; }
      link.onerror = function(){ document.head.removeChild(link); loadAsset(asset, cdnIndex+1); };
      link.onload = function(){ checkDone(); };
      document.head.appendChild(link);
    } else {
      var script = document.createElement('script');
      script.src = url;
      if(!DISABLE_SRI && SRI_MAP[asset.path]){ script.integrity = SRI_MAP[asset.path]; script.crossOrigin = 'anonymous'; }
      script.onerror = function(){ document.head.removeChild(script); loadAsset(asset, cdnIndex+1); };
      script.onload = function(){ checkDone(asset.global); };
      document.head.appendChild(script);
    }
  }

  function checkDone(expectedGlobal){
    loadedCount++;
    if(expectedGlobal && typeof window[expectedGlobal] === 'undefined') loadErrors.push('Missing ' + expectedGlobal);
    if(loadedCount >= ASSETS.length) showResult();
  }

  function showResult(){
    if(loadErrors.length > 0){
      var banner = document.getElementById('loadErrorBanner');
      var msg = document.getElementById('loadErrorMsg');
      msg.innerHTML = 'Load issues:<br>' + loadErrors.join('<br>') + '<br>Try ?nohash=1 or disable SRI toggle.';
      banner.style.display = 'block';
      console.error('Load errors:', loadErrors);
    }
  }

  // Start loading
  ASSETS.forEach(function(a){ loadAsset(a, 0); });

  // Simple mode inline logic (works even if JS modules fail)
  document.getElementById('simpleReplace').onclick = function(){
    var input = document.getElementById('simpleInput').value;
    var from = document.getElementById('simpleFrom').value;
    var to = document.getElementById('simpleTo').value;
    var regex = document.getElementById('simpleRegex').checked;
    var casei = document.getElementById('simpleCase').checked;
    if(!from) return;
    var re = regex ? new RegExp(from, 'g' + (casei?'i':'')) : new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g' + (casei?'i':''));
    document.getElementById('simpleOutput').value = input.replace(re, to);
  };
  document.getElementById('simpleCopy').onclick = function(){
    var out = document.getElementById('simpleOutput');
    out.select(); document.execCommand('copy');
    alert('Copied!');
  };
  document.getElementById('simpleDownload').onclick = function(){
    var blob = new Blob([document.getElementById('simpleOutput').value], {type:'text/plain'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'output.txt'; a.click();
  };
})();
</script>
</body>
</html>
